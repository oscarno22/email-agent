[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.core", "agent.ingestion", "agent.crons", "agent.stats", "agent.dev"]

[tool.setuptools.package-dir]
agent = "."

[project]
name = "email-agent"
version = "0.1.0"
description = "Email Agent"
requires-python = ">=3.12, <3.13"
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=2.9.0",
    "langgraph>=1.2.4",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.100.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0.0",
    "mjml-python>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
ignore = [
    "B008",  # function call in arg default — idiomatic for FastAPI's Depends()
]

[tool.ruff.lint.per-file-ignores]
# Long lines inside the inline HTML/CSS/JS template would be uglier if split.
"stats/dashboard.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
