name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write  # required for OIDC token exchange
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/email-agent:${{ github.sha }}
          LATEST_URI: ${{ steps.ecr-login.outputs.registry }}/email-agent:latest
        run: |
          docker build --platform linux/amd64 -f src/Dockerfile -t "$IMAGE_URI" -t "$LATEST_URI" src
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "LATEST_URI=$LATEST_URI" >> "$GITHUB_ENV"

      # ECS deploys the immutable :sha tag below, but the CloudFormation template's
      # EcrImageUri defaults to :latest — so `make deploy-infra` writes a task
      # definition pointing at :latest. Keep that tag current or an infra deploy
      # pins an image ECR's lifecycle policy has since expired (CannotPullContainerError,
      # service to 0 tasks — this happened on 2026-07-26).
      - name: Push to ECR
        run: |
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition email-agent \
            --query taskDefinition \
            > task-definition.json

      - name: Render updated task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: langgraph
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: email-agent
          cluster: email-agent
          wait-for-service-stability: true
